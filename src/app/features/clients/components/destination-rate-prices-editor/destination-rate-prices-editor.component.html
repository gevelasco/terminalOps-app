<div class="destination-rate-prices-editor">
  <div class="destination-rate-prices-editor__group-label-row">
    <span class="destination-rate-prices-editor__head-cell">Costos</span>
  </div>

  <div class="destination-rate-prices-editor__table" role="table">
    <div
      class="destination-rate-prices-editor__grid destination-rate-prices-editor__grid--head"
      role="row"
    >
      <span class="destination-rate-prices-editor__head-cell">Tipo de maniobra</span>
      <span class="destination-rate-prices-editor__head-cell">Tarifa</span>
      <span class="destination-rate-prices-editor__head-cell">Operador</span>
      <span class="destination-rate-prices-editor__head-cell">Casetas</span>
      <span class="destination-rate-prices-editor__head-cell">Viáticos</span>
      <span
        class="destination-rate-prices-editor__head-cell destination-rate-prices-editor__head-cell--action"
        aria-hidden="true"
      ></span>
    </div>

    <div
      class="destination-rate-prices-editor__rows"
      [class.destination-rate-prices-editor__rows--scroll]="rowsScroll()"
    >
      @for (row of priceDrafts(); track row.rowKey) {
        <div
          class="destination-rate-prices-editor__grid destination-rate-prices-editor__grid--form"
          role="row"
        >
          <app-destination-rate-maneuver-combobox
            [operationConfigurationId]="row.operationConfigurationId"
            [operationConfigurationName]="row.operationConfigurationName"
            [options]="availableOptionsForRow(row)"
            [allConfigurationNames]="allConfigurationNames()"
            [disabled]="disabled()"
            (valueChange)="onManeuverChange(row.rowKey, $event)"
          />
          <to-input
            placeholder="0"
            prefix="$"
            inputMode="decimal"
            [groupThousands]="true"
            [value]="row.clientCharge"
            [disabled]="disabled()"
            (valueChange)="updateField(row.rowKey, 'clientCharge', $event)"
          />
          <to-input
            placeholder="0"
            prefix="$"
            inputMode="decimal"
            [groupThousands]="true"
            [value]="row.operatorPaymentEstimate"
            [disabled]="disabled()"
            (valueChange)="updateField(row.rowKey, 'operatorPaymentEstimate', $event)"
          />
          <to-input
            placeholder="0"
            prefix="$"
            inputMode="decimal"
            [groupThousands]="true"
            [value]="row.estimatedTollAmount"
            [disabled]="disabled()"
            (valueChange)="updateField(row.rowKey, 'estimatedTollAmount', $event)"
          />
          <to-input
            placeholder="0"
            prefix="$"
            inputMode="decimal"
            [groupThousands]="true"
            [value]="row.perDiemAmount"
            [disabled]="disabled()"
            (valueChange)="updateField(row.rowKey, 'perDiemAmount', $event)"
          />
          <button
            type="button"
            class="destination-rate-prices-editor__remove"
            [disabled]="disabled() || !canRemoveRow(row)"
            aria-label="Quitar tipo de maniobra"
            (click)="removeRow(row.rowKey)"
          >
            <to-icon name="close" [size]="16" />
          </button>
        </div>
      }
    </div>
  </div>

  <to-button
    type="button"
    variant="outline"
    size="sm"
    [disabled]="!canAddRow()"
    (click)="addRow()"
  >
    <to-icon name="sell" [size]="16" />
    Agregar tipo
  </to-button>
</div>
